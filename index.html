<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AETHER // BOLT — Global Lightning & Generative Soundscape</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #04060b;
      --panel-bg: rgba(8, 12, 22, 0.72);
      --panel-border: rgba(56, 189, 248, 0.18);
      --accent-cyan: #38bdf8;
      --accent-electric: #a5f3fc;
      --accent-amber: #fbbf24;
      --accent-emerald: #34d399;
      --text-primary: #f1f5f9;
      --text-muted: #94a3b8;
      --font-sans: 'Space Grotesk', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-family: var(--font-sans);
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      z-index: 1;
      cursor: grab;
    }

    #canvas-container:active {
      cursor: grabbing;
    }

    /* Subtle radial vignette */
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background: radial-gradient(circle at center, transparent 48%, rgba(2, 4, 9, 0.75) 100%);
    }

    /* HUD Layout */
    .hud {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 28px;
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      pointer-events: auto;
    }

    .brand-title {
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
    }

    .brand-title span.slash {
      color: var(--accent-cyan);
    }

    .brand-sub {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      margin-top: 4px;
      text-transform: uppercase;
    }

    .status-cluster {
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--panel-border);
      border-radius: 999px;
      padding: 8px 16px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent-amber);
      box-shadow: 0 0 10px var(--accent-amber);
      transition: background-color 0.3s, box-shadow 0.3s;
    }

    .status-dot.live {
      background-color: var(--accent-emerald);
      box-shadow: 0 0 12px var(--accent-emerald);
      animation: pulseDot 2s infinite;
    }

    .status-dot.sim {
      background-color: var(--accent-cyan);
      box-shadow: 0 0 12px var(--accent-cyan);
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.25); }
    }

    .status-text {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      color: var(--text-primary);
    }

    .mode-toggle {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent-electric);
      font-family: var(--font-mono);
      font-size: 0.68rem;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .mode-toggle:hover {
      background: rgba(56, 189, 248, 0.25);
    }

    /* Bottom Controls & Telemetry */
    .hud-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      flex-wrap: wrap;
    }

    .panel {
      pointer-events: auto;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 16px 20px;
    }

    .telemetry-panel {
      min-width: 280px;
    }

    .telemetry-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 12px;
    }

    .stat-label {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .stat-value {
      font-family: var(--font-mono);
      font-size: 1.15rem;
      font-weight: 600;
      color: #fff;
      margin-top: 2px;
    }

    .last-strike {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--accent-cyan);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .synth-panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 340px;
    }

    .synth-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .audio-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(14, 165, 233, 0.15));
      border: 1px solid var(--accent-cyan);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 500;
      padding: 9px 16px;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: all 0.25s ease;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
    }

    .audio-btn:hover {
      background: rgba(56, 189, 248, 0.35);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.35);
    }

    .audio-btn.active {
      background: rgba(52, 211, 153, 0.2);
      border-color: var(--accent-emerald);
      color: var(--accent-emerald);
      box-shadow: 0 0 20px rgba(52, 211, 153, 0.2);
    }

    .visualizer-bars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 22px;
    }

    .v-bar {
      width: 3px;
      height: 4px;
      background: var(--accent-cyan);
      border-radius: 2px;
      transition: height 0.08s ease;
    }

    .controls-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .control-group label {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      display: flex;
      justify-content: space-between;
    }

    select, input[type="range"] {
      width: 100%;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      border-radius: 6px;
      padding: 5px 8px;
      outline: none;
    }

    input[type="range"] {
      padding: 0;
      height: 24px;
      accent-color: var(--accent-cyan);
      cursor: pointer;
    }

    /* Tooltip on hover */
    #tooltip {
      position: fixed;
      z-index: 10;
      pointer-events: none;
      background: rgba(4, 8, 16, 0.9);
      border: 1px solid var(--accent-cyan);
      border-radius: 6px;
      padding: 6px 10px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: #fff;
      opacity: 0;
      transform: translate(12px, -50%);
      transition: opacity 0.15s ease;
      white-space: nowrap;
    }

    @media (max-width: 720px) {
      .hud { padding: 14px; }
      .telemetry-panel, .synth-panel { width: 100%; min-width: unset; }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "topojson-client": "https://esm.sh/topojson-client@3.1.0"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>
  <div class="vignette"></div>
  <div id="tooltip"></div>

  <div class="hud">
    <div class="hud-top">
      <div class="brand">
        <div class="brand-title">AETHER <span class="slash">//</span> BOLT</div>
        <div class="brand-sub">Global Lightning Telemetry &amp; Generative Web Audio</div>
      </div>

      <div class="status-cluster">
        <div id="status-dot" class="status-dot"></div>
        <span id="status-text" class="status-text">CONNECTING BLITZORTUNG...</span>
        <button id="mode-toggle" class="mode-toggle" title="Switch between Live Blitzortung WebSocket and Storm Simulator">
          Sim Fallback
        </button>
      </div>
    </div>

    <div class="hud-bottom">
      <div class="panel telemetry-panel">
        <div class="telemetry-grid">
          <div>
            <div class="stat-label">Strikes / Min</div>
            <div id="stat-rate" class="stat-value">0</div>
          </div>
          <div>
            <div class="stat-label">Session Total</div>
            <div id="stat-total" class="stat-value">0</div>
          </div>
          <div>
            <div class="stat-label">Active Nodes</div>
            <div id="stat-active" class="stat-value">0</div>
          </div>
        </div>
        <div class="last-strike">
          <span id="last-coords">AWAITING DISCHARGE...</span>
          <span id="last-note">--</span>
        </div>
      </div>

      <div class="panel synth-panel">
        <div class="synth-header">
          <button id="audio-btn" class="audio-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>
            <span id="audio-btn-label">Initialize Audio</span>
          </button>

          <div class="visualizer-bars" id="visualizer">
            <div class="v-bar"></div>
            <div class="v-bar"></div>
            <div class="v-bar"></div>
            <div class="v-bar"></div>
            <div class="v-bar"></div>
            <div class="v-bar"></div>
            <div class="v-bar"></div>
            <div class="v-bar"></div>
          </div>
        </div>

        <div class="controls-row">
          <div class="control-group">
            <label for="scale-select">Harmonic Scale</label>
            <select id="scale-select">
              <option value="lydian">C Lydian (Ethereal)</option>
              <option value="pentatonic">A Minor Pentatonic</option>
              <option value="hirajoshi">Hirajoshi (Nocturnal)</option>
              <option value="dorian">D Dorian (Atmospheric)</option>
              <option value="wholetone">Whole Tone (Suspended)</option>
            </select>
          </div>

          <div class="control-group">
            <label for="drone-slider">Drone Bed <span id="drone-val">45%</span></label>
            <input id="drone-slider" type="range" min="0" max="100" value="45" />
          </div>

          <div class="control-group">
            <label for="reverb-slider">Space Reverb <span id="reverb-val">65%</span></label>
            <input id="reverb-slider" type="range" min="0" max="100" value="65" />
          </div>

          <div class="control-group">
            <label for="rotate-toggle">Globe Auto-Spin</label>
            <select id="rotate-toggle">
              <option value="on">Enabled (Slow)</option>
              <option value="off">Manual Orbit</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import * as topojson from 'topojson-client';

    // =========================================================================
    // 1. GENERATIVE AMBIENT WEB AUDIO SYNTHESIZER
    // =========================================================================
    class AmbientLightningSynth {
      constructor() {
        this.ctx = null;
        this.isRunning = false;
        this.masterGain = null;
        this.droneGain = null;
        this.reverbGain = null;
        this.dryGain = null;
        this.delayNode = null;
        this.activeVoices = 0;
        this.maxVoices = 14;
        this.currentScale = 'lydian';
        this.lastTriggerTime = 0;

        // Frequencies across 3 octaves (C3 to B5)
        this.scales = {
          lydian: [
            130.81, 146.83, 164.81, 185.00, 196.00, 220.00, 246.94,
            261.63, 293.66, 329.63, 369.99, 392.00, 440.00, 493.88,
            523.25, 587.33, 659.25, 739.99, 783.99, 880.00, 987.77
          ],
          pentatonic: [
            110.00, 130.81, 146.83, 164.81, 196.00,
            220.00, 261.63, 293.66, 329.63, 392.00,
            440.00, 523.25, 587.33, 659.25, 783.99
          ],
          hirajoshi: [
            130.81, 146.83, 155.56, 196.00, 207.65,
            261.63, 293.66, 311.13, 392.00, 415.30,
            523.25, 587.33, 622.25, 783.99, 830.61
          ],
          dorian: [
            146.83, 164.81, 174.61, 196.00, 220.00, 246.94, 261.63,
            293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25,
            587.33, 659.25, 698.46, 783.99, 880.00
          ],
          wholetone: [
            130.81, 146.83, 164.81, 185.00, 207.65, 233.08,
            261.63, 293.66, 329.63, 369.99, 415.30, 466.16,
            523.25, 587.33, 659.25, 739.99, 830.61
          ]
        };

        this.noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
      }

      freqToNoteName(freq) {
        const midi = Math.round(12 * Math.log2(freq / 440) + 69);
        const name = this.noteNames[midi % 12];
        const octave = Math.floor(midi / 12) - 1;
        return `${name}${octave}`;
      }

      createImpulseResponse(duration = 4.2, decay = 2.6) {
        const rate = this.ctx.sampleRate;
        const length = rate * duration;
        const impulse = this.ctx.createBuffer(2, length, rate);
        for (let ch = 0; ch < 2; ch++) {
          const data = impulse.getChannelData(ch);
          for (let i = 0; i < length; i++) {
            const env = Math.pow(1 - i / length, decay);
            data[i] = (Math.random() * 2 - 1) * env;
          }
        }
        return impulse;
      }

      init() {
        if (this.ctx) {
          if (this.ctx.state === 'suspended') this.ctx.resume();
          this.isRunning = true;
          return;
        }

        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();

        // Master Limiter / Compressor
        const compressor = this.ctx.createDynamicsCompressor();
        compressor.threshold.value = -16;
        compressor.knee.value = 18;
        compressor.ratio.value = 4;
        compressor.attack.value = 0.01;
        compressor.release.value = 0.25;

        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0.85;

        // Spatial Reverb & Stereo Delay Bus
        const convolver = this.ctx.createConvolver();
        convolver.buffer = this.createImpulseResponse(4.5, 2.5);

        this.reverbGain = this.ctx.createGain();
        this.reverbGain.gain.value = 0.65;

        this.dryGain = this.ctx.createGain();
        this.dryGain.gain.value = 0.65;

        // Ping-pong style stereo feedback delay
        this.delayNode = this.ctx.createDelay(2.0);
        this.delayNode.delayTime.value = 0.42;
        const delayFeedback = this.ctx.createGain();
        delayFeedback.gain.value = 0.35;
        const delayFilter = this.ctx.createBiquadFilter();
        delayFilter.type = 'lowpass';
        delayFilter.frequency.value = 1800;

        this.delayNode.connect(delayFilter);
        delayFilter.connect(delayFeedback);
        delayFeedback.connect(this.delayNode);
        delayFilter.connect(convolver);

        convolver.connect(this.reverbGain);
        this.reverbGain.connect(compressor);
        this.dryGain.connect(compressor);

        compressor.connect(this.masterGain);
        this.masterGain.connect(this.ctx.destination);

        this.startAmbientDrone();
        this.isRunning = true;
      }

      startAmbientDrone() {
        this.droneGain = this.ctx.createGain();
        this.droneGain.gain.value = 0.14;

        const droneFilter = this.ctx.createBiquadFilter();
        droneFilter.type = 'lowpass';
        droneFilter.frequency.value = 280;

        // Slow LFO modulating drone filter cutoff
        const lfo = this.ctx.createOscillator();
        const lfoGain = this.ctx.createGain();
        lfo.frequency.value = 0.07; // 14-second breathing cycle
        lfoGain.gain.value = 110;
        lfo.connect(lfoGain);
        lfoGain.connect(droneFilter.frequency);
        lfo.start();

        // Warm fifth + octave pad (C2, G2, C3)
        const freqs = [65.41, 98.00, 130.81];
        freqs.forEach((f, idx) => {
          const osc = this.ctx.createOscillator();
          osc.type = idx === 0 ? 'sine' : 'triangle';
          osc.frequency.value = f;
          osc.detune.value = (idx - 1) * 5;

          const panner = this.ctx.createStereoPanner();
          panner.pan.value = (idx - 1) * 0.35;

          osc.connect(panner);
          panner.connect(droneFilter);
          osc.start();
        });

        droneFilter.connect(this.droneGain);
        this.droneGain.connect(this.reverbGain);
        this.droneGain.connect(this.dryGain);
      }

      setDroneLevel(norm) {
        if (!this.droneGain || !this.ctx) return;
        this.droneGain.gain.setTargetAtTime(norm * 0.28, this.ctx.currentTime, 0.1);
      }

      setReverbLevel(norm) {
        if (!this.reverbGain || !this.ctx) return;
        this.reverbGain.gain.setTargetAtTime(norm * 1.1, this.ctx.currentTime, 0.1);
      }

      triggerStrike(lat, lon, intensity = 0.7) {
        const scale = this.scales[this.currentScale] || this.scales.lydian;
        // Map Latitude (-65 to +65) to musical pitch index
        const normLat = Math.max(0, Math.min(1, (lat + 65) / 130));
        const noteIdx = Math.floor(normLat * (scale.length - 1));
        const freq = scale[noteIdx];
        const noteName = this.freqToNoteName(freq);

        if (!this.isRunning || !this.ctx) return noteName;

        const now = this.ctx.currentTime;
        // Throttle dense bursts slightly for harmonic clarity
        if (now - this.lastTriggerTime < 0.055 || this.activeVoices >= this.maxVoices) {
          return noteName;
        }
        this.lastTriggerTime = now;
        this.activeVoices++;

        // Map Longitude (-180 to +180) to Stereo Pan (-0.9 to +0.9)
        const pan = Math.max(-0.9, Math.min(0.9, lon / 180));
        const panner = this.ctx.createStereoPanner();
        panner.pan.setValueAtTime(pan, now);

        // Crystalline Bell / Pluck Oscillator Pair
        const osc1 = this.ctx.createOscillator();
        const osc2 = this.ctx.createOscillator();
        osc1.type = 'sine';
        osc2.type = 'triangle';
        osc1.frequency.setValueAtTime(freq, now);
        // Subtle harmonic shimmer (octave or fifth detuned slightly)
        osc2.frequency.setValueAtTime(freq * 2, now);
        osc2.detune.setValueAtTime((Math.random() - 0.5) * 12, now);

        const voiceFilter = this.ctx.createBiquadFilter();
        voiceFilter.type = 'lowpass';
        voiceFilter.frequency.setValueAtTime(600 + intensity * 2600, now);
        voiceFilter.frequency.exponentialRampToValueAtTime(240, now + 2.4);

        const env = this.ctx.createGain();
        const peakGain = (0.07 + intensity * 0.09) / Math.sqrt(Math.max(1, this.activeVoices * 0.5));
        env.gain.setValueAtTime(0.0001, now);
        env.gain.linearRampToValueAtTime(peakGain, now + 0.018);
        env.gain.exponentialRampToValueAtTime(0.0001, now + 2.8);

        const osc2Gain = this.ctx.createGain();
        osc2Gain.gain.value = 0.25;

        osc1.connect(voiceFilter);
        osc2.connect(osc2Gain);
        osc2Gain.connect(voiceFilter);

        voiceFilter.connect(env);
        env.connect(panner);

        panner.connect(this.dryGain);
        panner.connect(this.delayNode);
        panner.connect(this.reverbGain);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + 2.9);
        osc2.stop(now + 2.9);

        // Distant Sub-Thunder Rumble for high-intensity discharges
        if (intensity > 0.78) {
          this.triggerThunderRumble(pan, now);
        }

        osc1.onended = () => {
          this.activeVoices = Math.max(0, this.activeVoices - 1);
        };

        return noteName;
      }

      triggerThunderRumble(pan, now) {
        const bufferSize = this.ctx.sampleRate * 2.2;
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }

        const whiteNoise = this.ctx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;

        const subFilter = this.ctx.createBiquadFilter();
        subFilter.type = 'lowpass';
        subFilter.frequency.setValueAtTime(135, now);
        subFilter.frequency.exponentialRampToValueAtTime(42, now + 2.0);

        const rumbleGain = this.ctx.createGain();
        rumbleGain.gain.setValueAtTime(0.0001, now);
        rumbleGain.gain.linearRampToValueAtTime(0.16, now + 0.12);
        rumbleGain.gain.exponentialRampToValueAtTime(0.0001, now + 2.1);

        const panner = this.ctx.createStereoPanner();
        panner.pan.value = pan * 0.6;

        whiteNoise.connect(subFilter);
        subFilter.connect(rumbleGain);
        rumbleGain.connect(panner);
        panner.connect(this.reverbGain);
        panner.connect(this.dryGain);

        whiteNoise.start(now);
        whiteNoise.stop(now + 2.2);
      }
    }

    // =========================================================================
    // 2. MINIMALIST 3D GLOBE & LIGHTNING VISUALIZATION (THREE.JS)
    // =========================================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x04060b, 0.035);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.8, 13.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enablePan = false;
    controls.minDistance = 7.2;
    controls.maxDistance = 24;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.45;

    const GLOBE_RADIUS = 5.0;
    const globeGroup = new THREE.Group();
    scene.add(globeGroup);

    // 2A. Core Obsidian Sphere
    const coreGeo = new THREE.SphereGeometry(GLOBE_RADIUS * 0.994, 64, 64);
    const coreMat = new THREE.MeshPhongMaterial({
      color: 0x060b16,
      emissive: 0x030712,
      specular: 0x1e293b,
      shininess: 18
    });
    const coreMesh = new THREE.Mesh(coreGeo, coreMat);
    globeGroup.add(coreMesh);

    // Subtle Rim/Directional Lighting
    const ambientLight = new THREE.AmbientLight(0x1e293b, 1.4);
    scene.add(ambientLight);

    const rimLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
    rimLight.position.set(12, 8, 10);
    scene.add(rimLight);

    // 2B. Atmospheric Fresnel Glow Halo
    const atmoGeo = new THREE.SphereGeometry(GLOBE_RADIUS * 1.065, 64, 64);
    const atmoMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      side: THREE.BackSide,
      blending: THREE.AdditiveBlending,
      uniforms: {
        glowColor: { value: new THREE.Color(0x38bdf8) }
      },
      vertexShader: `
        varying vec3 vNormal;
        varying vec3 vPositionNormal;
        void main() {
          vNormal = normalize(normalMatrix * normal);
          vPositionNormal = normalize((modelViewMatrix * vec4(position, 1.0)).xyz);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform vec3 glowColor;
        varying vec3 vNormal;
        varying vec3 vPositionNormal;
        void main() {
          float intensity = pow(0.62 - dot(vNormal, vPositionNormal), 3.2);
          gl_FragColor = vec4(glowColor, intensity * 0.65);
        }
      `
    });
    const atmoMesh = new THREE.Mesh(atmoGeo, atmoMat);
    globeGroup.add(atmoMesh);

    // 2C. Minimalist Lat/Lon Graticule Grid
    function buildGraticule() {
      const points = [];
      const r = GLOBE_RADIUS * 1.001;
      // Parallels (latitude)
      for (let lat = -75; lat <= 75; lat += 15) {
        const phi = (90 - lat) * (Math.PI / 180);
        for (let lon = -180; lon < 180; lon += 4) {
          const theta1 = (lon + 180) * (Math.PI / 180);
          const theta2 = (lon + 4 + 180) * (Math.PI / 180);
          points.push(
            new THREE.Vector3(-r * Math.sin(phi) * Math.cos(theta1), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta1)),
            new THREE.Vector3(-r * Math.sin(phi) * Math.cos(theta2), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta2))
          );
        }
      }
      // Meridians (longitude)
      for (let lon = -180; lon < 180; lon += 15) {
        const theta = (lon + 180) * (Math.PI / 180);
        for (let lat = -90; lat < 90; lat += 4) {
          const phi1 = (90 - lat) * (Math.PI / 180);
          const phi2 = (90 - (lat + 4)) * (Math.PI / 180);
          points.push(
            new THREE.Vector3(-r * Math.sin(phi1) * Math.cos(theta), r * Math.cos(phi1), r * Math.sin(phi1) * Math.sin(theta)),
            new THREE.Vector3(-r * Math.sin(phi2) * Math.cos(theta), r * Math.cos(phi2), r * Math.sin(phi2) * Math.sin(theta))
          );
        }
      }
      const geo = new THREE.BufferGeometry().setFromPoints(points);
      const mat = new THREE.LineBasicMaterial({ color: 0x1e293b, transparent: true, opacity: 0.32 });
      globeGroup.add(new THREE.LineSegments(geo, mat));
    }
    buildGraticule();

    // Helper: Convert Lat/Lon to 3D Cartesian Vector on Globe
    function latLonToVector3(lat, lon, radius = GLOBE_RADIUS) {
      const phi = (90 - lat) * (Math.PI / 180);
      const theta = (lon + 180) * (Math.PI / 180);
      return new THREE.Vector3(
        -radius * Math.sin(phi) * Math.cos(theta),
        radius * Math.cos(phi),
        radius * Math.sin(phi) * Math.sin(theta)
      );
    }

    // 2D. Load Vector World Coastlines (TopoJSON)
    async function loadCoastlines() {
      try {
        const res = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
        const topology = await res.json();
        const mesh = topojson.mesh(topology, topology.objects.countries);

        const linePositions = [];
        mesh.coordinates.forEach(ring => {
          for (let i = 0; i < ring.length - 1; i++) {
            const [lon1, lat1] = ring[i];
            const [lon2, lat2] = ring[i + 1];
            const v1 = latLonToVector3(lat1, lon1, GLOBE_RADIUS * 1.003);
            const v2 = latLonToVector3(lat2, lon2, GLOBE_RADIUS * 1.003);
            linePositions.push(v1.x, v1.y, v1.z, v2.x, v2.y, v2.z);
          }
        });

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
        const mat = new THREE.LineBasicMaterial({
          color: 0x38bdf8,
          transparent: true,
          opacity: 0.42
        });
        globeGroup.add(new THREE.LineSegments(geo, mat));
      } catch (err) {
        console.warn('Could not load vector world map:', err);
      }
    }
    loadCoastlines();

    // 2E. Deep Space Starfield
    function buildStarfield() {
      const starCount = 1400;
      const positions = new Float32Array(starCount * 3);
      for (let i = 0; i < starCount; i++) {
        const r = 28 + Math.random() * 45;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
        positions[i * 3 + 1] = r * Math.cos(phi);
        positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const mat = new THREE.PointsMaterial({ color: 0x94a3b8, size: 0.14, transparent: true, opacity: 0.65 });
      scene.add(new THREE.Points(geo, mat));
    }
    buildStarfield();

    // 2F. Lightning Strike Visual Entities
    const activeStrikes = [];
    const hitTargets = []; // For hover raycasting

    const coreFlashGeo = new THREE.SphereGeometry(0.055, 10, 10);
    const ringGeo = new THREE.RingGeometry(0.06, 0.085, 28);
    const boltGeo = new THREE.CylinderGeometry(0.008, 0.022, 0.55, 6);
    boltGeo.translate(0, 0.275, 0);

    function spawnLightningVisual(lat, lon, intensity = 0.75, noteName = '') {
      const surfacePos = latLonToVector3(lat, lon, GLOBE_RADIUS * 1.005);
      const normal = surfacePos.clone().normalize();

      const group = new THREE.Group();
      group.position.copy(surfacePos);
      group.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal);

      // 1. Bright core flash
      const coreMat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 1.0,
        blending: THREE.AdditiveBlending
      });
      const flashMesh = new THREE.Mesh(coreFlashGeo, coreMat);
      flashMesh.userData = { lat, lon, noteName };
      group.add(flashMesh);
      hitTargets.push(flashMesh);

      // 2. Expanding surface shockwave ring
      const ringMat = new THREE.MeshBasicMaterial({
        color: intensity > 0.8 ? 0xfbbf24 : 0x38bdf8,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const ringMesh = new THREE.Mesh(ringGeo, ringMat);
      ringMesh.rotation.x = -Math.PI / 2;
      group.add(ringMesh);

      // 3. Vertical plasma discharge spike
      const boltMat = new THREE.MeshBasicMaterial({
        color: 0xa5f3fc,
        transparent: true,
        opacity: 0.95,
        blending: THREE.AdditiveBlending
      });
      const boltMesh = new THREE.Mesh(boltGeo, boltMat);
      boltMesh.scale.y = 0.6 + intensity * 0.9;
      group.add(boltMesh);

      globeGroup.add(group);

      activeStrikes.push({
        group,
        flashMesh,
        ringMesh,
        boltMesh,
        age: 0,
        maxAge: 2.4 + intensity * 1.2
      });
    }

    // =========================================================================
    // 3. BLITZORTUNG LIVE WEBSOCKET + LZW DECODER + REALISTIC FALLBACK
    // =========================================================================
    const synth = new AmbientLightningSynth();

    // Telemetry state
    let totalStrikes = 0;
    const recentTimestamps = [];

    const statRateEl = document.getElementById('stat-rate');
    const statTotalEl = document.getElementById('stat-total');
    const statActiveEl = document.getElementById('stat-active');
    const lastCoordsEl = document.getElementById('last-coords');
    const lastNoteEl = document.getElementById('last-note');
    const statusDotEl = document.getElementById('status-dot');
    const statusTextEl = document.getElementById('status-text');
    const modeToggleBtn = document.getElementById('mode-toggle');

    function formatCoord(lat, lon) {
      const ns = lat >= 0 ? 'N' : 'S';
      const ew = lon >= 0 ? 'E' : 'W';
      return `${Math.abs(lat).toFixed(2)}°${ns} ${Math.abs(lon).toFixed(2)}°${ew}`;
    }

    function handleStrikeEvent(lat, lon, intensity = 0.7) {
      if (typeof lat !== 'number' || typeof lon !== 'number' || isNaN(lat) || isNaN(lon)) return;
      if (lat < -90 || lat > 90 || lon < -180 || lon > 180) return;

      totalStrikes++;
      const now = performance.now();
      recentTimestamps.push(now);

      const noteName = synth.triggerStrike(lat, lon, intensity);
      spawnLightningVisual(lat, lon, intensity, noteName);

      statTotalEl.textContent = totalStrikes.toLocaleString();
      lastCoordsEl.textContent = formatCoord(lat, lon);
      lastNoteEl.textContent = synth.isRunning ? `♪ ${noteName}` : noteName;
    }

    // Blitzortung LZW Decompression (used by Blitzortung public WebSocket streams)
    function decodeBlitzortungLZW(compressed) {
      if (!compressed || typeof compressed !== 'string') return '';
      const dict = {};
      const data = (compressed + '').split('');
      let currChar = data[0];
      let oldPhrase = currChar;
      const out = [currChar];
      let code = 256;
      let phrase;

      for (let i = 1; i < data.length; i++) {
        const currCode = data[i].charCodeAt(0);
        if (currCode < 256) {
          phrase = data[i];
        } else {
          phrase = dict[currCode] ? dict[currCode] : (oldPhrase + currChar);
        }
        out.push(phrase);
        currChar = phrase.charAt(0);
        dict[code] = oldPhrase + currChar;
        code++;
        oldPhrase = phrase;
      }
      return out.join('');
    }

    class BlitzortungClient {
      constructor() {
        this.ws = null;
        this.isSimulating = false;
        this.simTimer = null;
        this.watchdogTimer = null;
        this.receivedLiveData = false;
        this.hosts = [
          'wss://ws1.blitzortung.org/',
          'wss://ws7.blitzortung.org/',
          'wss://ws8.blitzortung.org/'
        ];
        this.hostIdx = 0;

        // Global meteorological lightning hotspots (lat, lon, spread)
        this.stormCells = [
          { name: 'Lake Maracaibo', lat: 9.8, lon: -71.6, spread: 4.5 },
          { name: 'Congo Basin', lat: -1.5, lon: 21.0, spread: 9.0 },
          { name: 'US Gulf Coast', lat: 29.5, lon: -89.0, spread: 6.5 },
          { name: 'Maritime Southeast Asia', lat: 1.2, lon: 112.0, spread: 8.5 },
          { name: 'Paraná River Basin', lat: -26.0, lon: -56.0, spread: 6.0 },
          { name: 'Bay of Bengal', lat: 18.5, lon: 89.0, spread: 5.5 },
          { name: 'Mediterranean', lat: 38.0, lon: 15.0, spread: 4.5 }
        ];
      }

      connect() {
        this.stopSimulation();
        this.receivedLiveData = false;
        this.updateStatus('connecting', 'CONNECTING BLITZORTUNG...');

        const url = this.hosts[this.hostIdx % this.hosts.length];
        this.hostIdx++;

        try {
          this.ws = new WebSocket(url);

          this.ws.onopen = () => {
            // Blitzortung public WebSocket handshake payload
            this.ws.send(JSON.stringify({ a: 111 }));
            this.updateStatus('live', 'LIVE // BLITZORTUNG FEED');
          };

          this.ws.onmessage = (event) => {
            try {
              let raw = event.data;
              if (typeof raw === 'string' && !raw.startsWith('{')) {
                raw = decodeBlitzortungLZW(raw);
              }
              const payload = JSON.parse(raw);
              if (payload && typeof payload.lat === 'number' && typeof payload.lon === 'number') {
                this.receivedLiveData = true;
                if (this.isSimulating) this.stopSimulation();
                this.updateStatus('live', 'LIVE // BLITZORTUNG FEED');
                const stationCount = Array.isArray(payload.sig) ? payload.sig.length : 12;
                const intensity = Math.min(1, Math.max(0.45, stationCount / 22));
                handleStrikeEvent(payload.lat, payload.lon, intensity);
              }
            } catch (_) {
              // Ignore malformed heartbeat frames
            }
          };

          this.ws.onerror = () => {
            this.fallbackToSim('LIVE STREAM BLOCKED // SIM MODE');
          };

          this.ws.onclose = () => {
            if (!this.isSimulating) {
              this.fallbackToSim('FEED CLOSED // SIM MODE');
            }
          };

          // If Blitzortung rate-limits browser Origin or no strikes arrive in 5.5s, enable seamless simulation
          clearTimeout(this.watchdogTimer);
          this.watchdogTimer = setTimeout(() => {
            if (!this.receivedLiveData && !this.isSimulating) {
              this.fallbackToSim('STORM SIMULATOR (LIVE STANDBY)');
            }
          }, 5500);
        } catch (err) {
          this.fallbackToSim('STORM SIMULATOR');
        }
      }

      fallbackToSim(label) {
        if (this.isSimulating) return;
        this.isSimulating = true;
        this.updateStatus('sim', label);
        modeToggleBtn.textContent = 'Retry Live';

        const scheduleNext = () => {
          if (!this.isSimulating) return;
          // Pick 1–2 active storm cells for realistic clustered bursts
          const cell = this.stormCells[Math.floor(Math.random() * this.stormCells.length)];
          const lat = cell.lat + (Math.random() - 0.5) * cell.spread;
          const lon = cell.lon + (Math.random() - 0.5) * cell.spread;
          const intensity = 0.4 + Math.random() * 0.6;
          handleStrikeEvent(lat, lon, intensity);

          // Variable inter-arrival timing (180ms to 1400ms)
          const nextDelay = Math.random() < 0.3
            ? 160 + Math.random() * 240
            : 450 + Math.random() * 950;
          this.simTimer = setTimeout(scheduleNext, nextDelay);
        };

        scheduleNext();
      }

      stopSimulation() {
        this.isSimulating = false;
        clearTimeout(this.simTimer);
        modeToggleBtn.textContent = 'Sim Mode';
      }

      toggleMode() {
        if (this.isSimulating) {
          if (this.ws) {
            try { this.ws.close(); } catch (_) {}
          }
          this.connect();
        } else {
          if (this.ws) {
            try { this.ws.close(); } catch (_) {}
          }
          this.fallbackToSim('STORM SIMULATOR (MANUAL)');
        }
      }

      updateStatus(state, text) {
        statusTextEl.textContent = text;
        statusDotEl.className = 'status-dot';
        if (state === 'live') statusDotEl.classList.add('live');
        if (state === 'sim') statusDotEl.classList.add('sim');
      }
    }

    const blitzClient = new BlitzortungClient();
    blitzClient.connect();

    // =========================================================================
    // 4. UI INTERACTIONS & RAYCAST TOOLTIP
    // =========================================================================
    const audioBtn = document.getElementById('audio-btn');
    const audioBtnLabel = document.getElementById('audio-btn-label');
    const scaleSelect = document.getElementById('scale-select');
    const droneSlider = document.getElementById('drone-slider');
    const droneVal = document.getElementById('drone-val');
    const reverbSlider = document.getElementById('reverb-slider');
    const reverbVal = document.getElementById('reverb-val');
    const rotateToggle = document.getElementById('rotate-toggle');
    const visualizerBars = document.querySelectorAll('.v-bar');
    const tooltip = document.getElementById('tooltip');

    audioBtn.addEventListener('click', () => {
      if (!synth.isRunning) {
        synth.init();
        audioBtn.classList.add('active');
        audioBtnLabel.textContent = 'Audio Active';
      } else {
        synth.ctx.suspend();
        synth.isRunning = false;
        audioBtn.classList.remove('active');
        audioBtnLabel.textContent = 'Resume Audio';
      }
    });

    modeToggleBtn.addEventListener('click', () => {
      blitzClient.toggleMode();
    });

    scaleSelect.addEventListener('change', (e) => {
      synth.currentScale = e.target.value;
    });

    droneSlider.addEventListener('input', (e) => {
      const v = Number(e.target.value);
      droneVal.textContent = `${v}%`;
      synth.setDroneLevel(v / 100);
    });

    reverbSlider.addEventListener('input', (e) => {
      const v = Number(e.target.value);
      reverbVal.textContent = `${v}%`;
      synth.setReverbLevel(v / 100);
    });

    rotateToggle.addEventListener('change', (e) => {
      controls.autoRotate = e.target.value === 'on';
    });

    // Raycaster for hovering over active lightning strikes
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2(-999, -999);

    window.addEventListener('pointermove', (e) => {
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(pointer, camera);
      const intersects = raycaster.intersectObjects(hitTargets, false);

      if (intersects.length > 0) {
        const data = intersects[0].object.userData;
        tooltip.style.opacity = '1';
        tooltip.style.left = `${e.clientX}px`;
        tooltip.style.top = `${e.clientY}px`;
        tooltip.textContent = `${formatCoord(data.lat, data.lon)}  |  Note ${data.noteName}`;
      } else {
        tooltip.style.opacity = '0';
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // =========================================================================
    // 5. ANIMATION & TELEMETRY LOOP
    // =========================================================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.1);
      const now = performance.now();

      controls.update();

      // Update active lightning rings & flashes
      for (let i = activeStrikes.length - 1; i >= 0; i--) {
        const s = activeStrikes[i];
        s.age += dt;
        const progress = s.age / s.maxAge;

        if (progress >= 1) {
          globeGroup.remove(s.group);
          const hitIdx = hitTargets.indexOf(s.flashMesh);
          if (hitIdx > -1) hitTargets.splice(hitIdx, 1);

          s.flashMesh.material.dispose();
          s.ringMesh.material.dispose();
          s.boltMesh.material.dispose();
          activeStrikes.splice(i, 1);
          continue;
        }

        // Expanding shockwave ring
        const scale = 1 + progress * 7.5;
        s.ringMesh.scale.set(scale, scale, 1);
        s.ringMesh.material.opacity = Math.pow(1 - progress, 1.8) * 0.85;

        // Core point glow fade
        const flashScale = 1 + Math.sin(Math.min(1, progress * 4) * Math.PI) * 0.6;
        s.flashMesh.scale.setScalar(flashScale * (1 - progress * 0.5));
        s.flashMesh.material.opacity = Math.pow(1 - progress, 1.3);

        // Quick vertical bolt decay
        s.boltMesh.material.opacity = Math.max(0, 1 - progress * 4.5);
      }

      // Compute rolling 60-second strike rate
      while (recentTimestamps.length > 0 && now - recentTimestamps[0] > 60000) {
        recentTimestamps.shift();
      }
      statRateEl.textContent = recentTimestamps.length;
      statActiveEl.textContent = activeStrikes.length;

      // Subtle audio visualizer animation driven by active synth voices
      visualizerBars.forEach((bar, idx) => {
        if (!synth.isRunning) {
          bar.style.height = '4px';
          return;
        }
        const wave = Math.sin(now * 0.006 + idx * 0.8) * 0.5 + 0.5;
        const voiceBoost = Math.min(1, synth.activeVoices / 6);
        const h = 4 + wave * 6 + voiceBoost * (6 + Math.random() * 6);
        bar.style.height = `${Math.round(h)}px`;
      });

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
